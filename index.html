<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إلى نور عيني ❤️🥹🫶🏻</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;800;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: { deeppink: { 900:'#3A031A', 800:'#520826', 700:'#750B37', 600:'#9E0D48', 500:'#C71585', 400:'#E0115F' } },
    fontFamily: { cairo:['Cairo','sans-serif'], amiri:['Amiri','serif'], reem:['Reem Kufi','sans-serif'] }
  } }
}
</script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background:#2b0213; }
  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #2b0213 0%, #520826 40%, #800A3B 70%, #40041D 100%);
    background-color: #2b0213;
    min-height: 100vh; overflow-x: hidden; color: #fff;
  }
  .glass-box {
    background: rgba(100, 10, 48, 0.72);
    border: 1px solid rgba(255, 182, 193, 0.2);
    box-shadow: 0 15px 35px rgba(0,0,0,.5), inset 0 0 15px rgba(255,105,180,.15);
  }
  .tilted-text {
    transform: rotate(-15deg); opacity: .18; font-family: 'Amiri', serif;
    letter-spacing: 2px; user-select: none; pointer-events: none;
    text-shadow: 0 0 20px rgba(255,105,180,.5);
  }
  .heart-grid {
    will-change: transform;
    display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px;
    width: min(78vw, 320px); animation: heartPulse 2.5s infinite ease-in-out;
    cursor: pointer; user-select: none;
  }
  .heart-grid span { font-size: clamp(14px, 4.2vw, 26px); line-height: 1.25; text-align: center; }
  @keyframes heartPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .heart-particle { will-change: transform, opacity; position: absolute; pointer-events: none; animation: floatUp linear infinite; z-index: 1; }
  @keyframes floatUp {
    0% { transform: translateY(105vh) scale(.5) rotate(0deg); opacity: 0; }
    20%,80% { opacity: .8; }
    100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
  }
  .btn-love {
    background: linear-gradient(45deg, #9E0D48, #E0115F);
    box-shadow: 0 8px 25px rgba(224,17,95,.5);
    transition: all .3s cubic-bezier(.175,.885,.32,1.275);
  }
  .btn-love:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 12px 30px rgba(224,17,95,.8); background: linear-gradient(45deg,#B80A53,#FF1493); }
  .btn-love:active { transform: translateY(1px) scale(.98); }
</style>
</head>
<body class="relative flex items-center justify-center p-4">

<div id="particles-container" class="fixed inset-0 overflow-hidden pointer-events-none"></div>

<!-- Screen 1 -->
<main id="screen-welcome" class="relative z-10 max-w-lg w-full text-center transition-all duration-700 opacity-100 scale-100">
  <div class="glass-box p-8 sm:p-12 rounded-3xl flex flex-col items-center justify-center space-y-8">
    <div class="relative">
      <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-deeppink-700 to-pink-500 flex items-center justify-center shadow-xl animate-bounce">
        <span class="text-5xl">💝</span>
      </div>
      <div class="absolute -top-2 -right-2 text-2xl animate-pulse">✨</div>
      <div class="absolute -bottom-1 -left-2 text-2xl animate-pulse">💖</div>
    </div>
    <div class="space-y-2">
      <h1 class="text-3xl sm:text-4xl font-black text-pink-100 tracking-wide font-reem">إلى نور عيني 🥹🫶🏻</h1>
      <h2 class="text-lg sm:text-xl font-bold text-pink-200">رسالة خاصة جداً 💌</h2>
      <p class="text-xs sm:text-sm text-pink-200/80 font-light">اضغطي على الزر بأسفل لتكتشفي المفاجأة</p>
    </div>
    <button onclick="openGreeting()" class="btn-love px-8 py-4 rounded-2xl text-lg sm:text-xl font-black text-white flex items-center gap-3">
      <span>افتحي يا نونه</span><span>😍</span>
    </button>
  </div>
</main>

<!-- Screen 2 -->
<main id="screen-greeting" class="hidden relative z-10 max-w-3xl w-full my-auto transition-all duration-1000 opacity-0 scale-90">
  <div class="glass-box p-6 sm:p-10 rounded-3xl relative overflow-hidden border border-pink-400/30">
    <div class="tilted-text absolute top-2 right-3 sm:top-4 sm:right-6 text-6xl sm:text-8xl md:text-9xl font-extrabold text-pink-300/30 whitespace-nowrap">بحبك</div>
    <div class="tilted-text absolute bottom-2 left-3 sm:bottom-4 sm:left-6 text-5xl sm:text-7xl font-extrabold text-pink-300/20 whitespace-nowrap" style="transform: rotate(12deg);">بحبك</div>

    <div class="relative z-10 flex flex-col items-center text-center space-y-8">
      <div class="w-full flex justify-end items-center px-2">
                <button onclick="toggleAudio()" class="text-xs bg-pink-500/20 hover:bg-pink-500/40 text-pink-200 px-3 py-1.5 rounded-full border border-pink-400/30 transition-all flex items-center gap-1.5">
          <span>🎵</span><span id="audio-status">تشغيل الموسيقى</span>
        </button>
      </div>

      <div class="space-y-4 max-w-2xl">
        <h2 class="text-2xl sm:text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-100 via-rose-200 to-pink-300 leading-snug sm:leading-relaxed font-reem">
          وحشتيني اوي يا اجمل و احلى بنوته ف الكون كله
        </h2>
        <div class="w-24 h-1 bg-gradient-to-r from-transparent via-pink-400 to-transparent mx-auto rounded-full"></div>
      </div>

      <div class="w-full flex justify-center items-center py-4">
        <div id="heart-grid" class="heart-grid" onclick="burstHearts(event)"></div>
      </div>

      <p class="text-xs sm:text-sm text-pink-200/80 font-light bg-deeppink-800/40 px-4 py-2 rounded-xl border border-pink-500/20">
        💡 اضغطي على القلب الكبير فوق لتطلقي المزيد من القلوب!
      </p>
    </div>
  </div>
</main>

<script>
/* ---------- Floating background hearts ---------- */
function createParticles() {
  const c = document.getElementById('particles-container');
  const icons = ['❤️','💖','💗','💕','🌸','✨'];
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'heart-particle';
    p.innerText = icons[Math.floor(Math.random() * icons.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (Math.random() * 16 + 14) + 'px';
    p.style.animationDuration = (Math.random() * 8 + 6) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    c.appendChild(p);
  }
}

/* ---------- Big heart made of emojis ---------- */
function buildHeart() {
  const rows = [
    '011000110',
    '111101111',
    '111111111',
    '111111111',
    '011111110',
    '001111100',
    '000111000',
    '000010000'
  ];
  const grid = document.getElementById('heart-grid');
  rows.forEach(r => [...r].forEach(ch => {
    const s = document.createElement('span');
    s.textContent = ch === '1' ? '❤️' : '';
    grid.appendChild(s);
  }));
}

/* ---------- Music (synthesized, no external file) ---------- */
let ctx = null, playing = false, timer = null, step = 0, nextTime = 0;
const chords = [
  [261.63, 329.63, 392.00, 523.25],   // C
  [220.00, 261.63, 329.63, 440.00],   // Am
  [174.61, 220.00, 261.63, 349.23],   // F
  [196.00, 246.94, 293.66, 392.00]    // G
];
const pattern = [0, 1, 2, 3, 2, 1, 2, 1];
const noteLen = 0.42;

function playNote(freq, t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.12, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + noteLen * 2.2);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + noteLen * 2.3);
}
function schedule() {
  while (nextTime < ctx.currentTime + 0.6) {
    const chord = chords[Math.floor(step / 8) % chords.length];
    const idx = step % 8;
    playNote(chord[pattern[idx]], nextTime);
    if (idx === 0) playNote(chord[0] / 2, nextTime);
    nextTime += noteLen;
    step++;
  }
}
function startMusic() {
  try {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 200);
    playing = true;
    document.getElementById('audio-status').innerText = 'إيقاف الموسيقى';
  } catch (e) { console.log('Audio unavailable', e); }
}
function stopMusic() {
  clearInterval(timer); playing = false;
  document.getElementById('audio-status').innerText = 'تشغيل الموسيقى';
}
function toggleAudio() { playing ? stopMusic() : startMusic(); }

/* ---------- Screen transition ---------- */
function openGreeting() {
  const s1 = document.getElementById('screen-welcome');
  const s2 = document.getElementById('screen-greeting');
  startMusic();
  s1.classList.add('opacity-0', 'scale-90');
  setTimeout(() => {
    s1.classList.add('hidden');
    s2.classList.remove('hidden');
    setTimeout(() => {
      s2.classList.remove('opacity-0', 'scale-90');
      s2.classList.add('opacity-100', 'scale-100');
      triggerConfetti();
    }, 50);
  }, 700);
}

/* ---------- Heart burst ---------- */
function burstHearts(event) {
  const emojis = ['💖', '❤️', '💕', '✨', '🌸'];
  for (let i = 0; i < 8; i++) {
    const h = document.createElement('div');
    h.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    Object.assign(h.style, {
      position: 'fixed',
      left: (event.clientX || innerWidth / 2) + 'px',
      top: (event.clientY || innerHeight / 2) + 'px',
      fontSize: '24px', pointerEvents: 'none', zIndex: '9999',
      transition: 'all 1s cubic-bezier(0.25, 1, 0.5, 1)'
    });
    document.body.appendChild(h);
    const a = Math.random() * Math.PI * 2, v = Math.random() * 120 + 50;
    const x = Math.cos(a) * v, y = Math.sin(a) * v - 60;
    setTimeout(() => { h.style.transform = `translate(${x}px, ${y}px) scale(0)`; h.style.opacity = '0'; }, 20);
    setTimeout(() => h.remove(), 1000);
  }
}

/* ---------- Confetti ---------- */
function triggerConfetti() {
  for (let i = 0; i < 16; i++) {
    const c = document.createElement('div');
    c.innerText = ['🌷', '💖', '✨', '🌹'][Math.floor(Math.random() * 4)];
    Object.assign(c.style, {
      position: 'fixed', top: '-20px', left: Math.random() * 100 + 'vw',
      fontSize: (Math.random() * 18 + 12) + 'px', zIndex: '999',
      transition: `all ${Math.random() * 3 + 2}s linear`
    });
    document.body.appendChild(c);
    setTimeout(() => { c.style.top = '105vh'; c.style.transform = `rotate(${Math.random() * 720}deg)`; c.style.opacity = '0.3'; }, 50);
    setTimeout(() => c.remove(), 5500);
  }
}

window.addEventListener('load', () => { createParticles(); buildHeart(); });
</script>
</body>
</html>
